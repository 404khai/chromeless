name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="${{ github.event.inputs.tag }}"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          version="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "$version" > VERSION

      - name: Package arm64
        run: ./scripts/package-release.sh arm64

      - name: Package x86_64
        run: ./scripts/package-release.sh x86_64

      - name: Update cask checksums
        run: ./scripts/update-cask-sha256.sh

      - name: Validate cask
        run: ./tests/validate-cask.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Chromeless ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            dist/Chromeless-v${{ steps.version.outputs.version }}-macos-arm64.zip
            dist/Chromeless-v${{ steps.version.outputs.version }}-macos-x86_64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload updated cask artifact
        uses: actions/upload-artifact@v4
        with:
          name: chromeless-cask
          path: Casks/chromeless.rb

<!doctype html>
<html><head><meta charset="utf-8"><title>chart fixture</title>
<style>
  body { margin: 0; background: #0a0a0e; color: #e8e8ee; font: 16px -apple-system, system-ui;
         display: flex; align-items: center; justify-content: center; height: 100vh; }
  .chart { width: 320px; height: 200px; border-radius: 12px; background: #1b1b22;
           display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity .3s; }
  .chart-ready { opacity: 1; background: linear-gradient(135deg, #3b82f6, #8b5cf6); }
</style></head>
<body>
  <div class="chart" id="chart">Loading…</div>
  <script>
    setTimeout(function () {
      var el = document.getElementById('chart');
      el.textContent = 'Revenue +42%';
      el.classList.add('chart-ready');
    }, 2000);
  </script>
</body></html>
